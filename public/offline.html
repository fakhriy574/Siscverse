<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05060b" />
  <title>Siscverse | Sedang offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; text-align: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #eceef5;
      background: radial-gradient(90% 60% at 50% 0%, rgba(74, 140, 255, 0.2), transparent 60%), #05060b; }
    .card { max-width: 360px; }
    .planet { width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #ffd98a, #f2b84b 55%, #8a5a10); box-shadow: 0 0 40px rgba(242, 184, 75, 0.35); }
    h1 { font-size: 1.6rem; margin-bottom: 0.6rem; }
    p { color: #9ba2ba; line-height: 1.6; margin-bottom: 1.6rem; }
    button { padding: 0.85rem 1.6rem; border: 0; border-radius: 12px; background: #f2b84b; color: #1a1204; font-size: 1rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <div class="planet" aria-hidden="true"></div>
    <h1>Kamu sedang offline</h1>
    <p>Siscverse butuh internet untuk menampilkan jadwal, kas, dan foto terbaru. Sambungkan internet lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
